<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Trading AI SaaS V3 — Dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=IBM+Plex+Mono:wght@300;400;500;700&family=Figtree:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#05080f;--s1:#080d18;--s2:#0c1220;--s3:#101828;
  --bd:rgba(255,255,255,0.06);--bd2:rgba(255,255,255,0.11);
  --cy:#00e5cc;--cyd:rgba(0,229,204,0.1);--cyb:rgba(0,229,204,0.18);
  --gd:#f0b429;--gdd:rgba(240,180,41,0.1);
  --rd:#ff3d5a;--rdd:rgba(255,61,90,0.1);
  --bl:#4f8ef7;--bld:rgba(79,142,247,0.1);
  --vl:#8b5cf6;--vld:rgba(139,92,246,0.1);
  --or:#f97316;--ord:rgba(249,115,22,0.1);
  --tx:#dde4f0;--tx2:#8899b4;--tx3:#445570;
  --mono:'IBM Plex Mono',monospace;--head:'Syne',sans-serif;--body:'Figtree',sans-serif;
}
body{background:var(--bg);color:var(--tx);font-family:var(--body);font-size:14px;min-height:100vh}
.shell{display:flex;flex-direction:column;min-height:100vh}
.topbar{display:flex;align-items:center;justify-content:space-between;padding:0 18px;height:50px;background:var(--s1);border-bottom:1px solid var(--bd);position:sticky;top:0;z-index:100}
.logo{font-family:var(--head);font-size:14px;font-weight:800;display:flex;align-items:center;gap:7px}
.logodot{width:7px;height:7px;border-radius:50%;background:var(--cy);animation:glow 2s infinite}
@keyframes glow{0%,100%{opacity:1}50%{opacity:.4}}
.body-wrap{display:flex;flex:1}
.sidebar{width:188px;background:var(--s1);border-right:1px solid var(--bd);display:flex;flex-direction:column;padding:12px 0;flex-shrink:0;overflow-y:auto}
.nav-grp{margin-bottom:16px}
.nav-lbl{font-family:var(--mono);font-size:9px;letter-spacing:2px;color:var(--tx3);padding:0 14px 5px;text-transform:uppercase}
.nav-item{display:flex;align-items:center;gap:9px;padding:8px 14px;cursor:pointer;font-size:12px;color:var(--tx2);border-left:2px solid transparent;font-weight:500;transition:all .15s}
.nav-item:hover{color:var(--tx);background:rgba(255,255,255,0.03)}
.nav-item.on{color:var(--cy);background:var(--cyd);border-left-color:var(--cy)}
.nav-badge{font-size:9px;margin-left:auto;background:var(--rdd);color:var(--rd);border-radius:3px;padding:1px 5px;font-family:var(--mono)}
.content{flex:1;overflow-y:auto;padding:20px}
.card{background:var(--s2);border:1px solid var(--bd);border-radius:14px;padding:18px}
.card-sm{background:var(--s2);border:1px solid var(--bd);border-radius:10px;padding:14px}
.ct{font-family:var(--mono);font-size:9px;letter-spacing:2px;color:var(--tx3);margin-bottom:12px;text-transform:uppercase}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.metric{font-family:var(--head);font-size:24px;font-weight:700}
.badge{display:inline-flex;align-items:center;font-family:var(--mono);font-size:9px;font-weight:700;padding:2px 7px;border-radius:4px;letter-spacing:1px;white-space:nowrap}
.b-cy{background:var(--cyd);color:var(--cy);border:1px solid rgba(0,229,204,.2)}
.b-gd{background:var(--gdd);color:var(--gd);border:1px solid rgba(240,180,41,.2)}
.b-rd{background:var(--rdd);color:var(--rd);border:1px solid rgba(255,61,90,.2)}
.b-bl{background:var(--bld);color:var(--bl)}
.b-or{background:var(--ord);color:var(--or);border:1px solid rgba(249,115,22,.2)}
.b-gray{background:rgba(255,255,255,0.05);color:var(--tx2);border:1px solid var(--bd)}
.b-gr{background:rgba(0,229,150,0.1);color:#00e596;border:1px solid rgba(0,229,150,0.2)}
.b-vl{background:var(--vld);color:var(--vl);border:1px solid rgba(139,92,246,.2)}
.btn{font-family:var(--mono);font-size:10px;letter-spacing:1px;padding:8px 16px;border-radius:7px;cursor:pointer;border:none;font-weight:700;display:inline-flex;align-items:center;gap:5px;transition:all .15s}
.btn-cy{background:var(--cy);color:#000}.btn-cy:hover{background:#00ffea}
.btn-rd{background:var(--rd);color:#fff}
.btn-ghost{background:rgba(255,255,255,0.05);color:var(--tx2);border:1px solid var(--bd)}.btn-ghost:hover{background:rgba(255,255,255,0.09);color:var(--tx)}
.btn-gd{background:var(--gd);color:#000}
.btn-sm{padding:5px 10px;font-size:9px}
.tbl{width:100%;border-collapse:collapse}
.tbl th{font-family:var(--mono);font-size:9px;letter-spacing:1px;color:var(--tx3);padding:9px 11px;text-align:left;border-bottom:1px solid var(--bd);text-transform:uppercase}
.tbl td{font-size:12px;padding:10px 11px;border-bottom:1px solid rgba(255,255,255,0.03);color:var(--tx2)}
.tbl tr:hover td{background:rgba(255,255,255,0.02)}
.mono{font-family:var(--mono)}
.prog{height:5px;background:rgba(255,255,255,.06);border-radius:3px;overflow:hidden}
.prog-f{height:100%;border-radius:3px;transition:width .5s}
.tgl{position:relative;width:36px;height:19px;flex-shrink:0}
.tgl input{opacity:0;width:0;height:0}
.tsl{position:absolute;inset:0;background:rgba(255,255,255,.1);border-radius:19px;cursor:pointer;transition:.3s}
.tsl:before{content:'';position:absolute;width:13px;height:13px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.3s}
.tgl input:checked+.tsl{background:var(--cy)}
.tgl input:checked+.tsl:before{transform:translateX(17px)}
.divider{height:1px;background:var(--bd);margin:14px 0}
.row{display:flex;align-items:center;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--bd)}
.row:last-child{border-bottom:none}
.notif{position:fixed;top:58px;right:18px;z-index:999;background:var(--s2);border:1px solid var(--bd2);border-radius:9px;padding:11px 16px;font-family:var(--mono);font-size:11px;animation:si .2s ease;box-shadow:0 8px 32px rgba(0,0,0,.5);max-width:300px}
@keyframes si{from{transform:translateX(40px);opacity:0}to{transform:translateX(0);opacity:1}}
.tier-bar{display:flex;align-items:center;gap:8px;padding:7px 16px;background:var(--s3);border-bottom:1px solid var(--bd);flex-wrap:wrap;font-family:var(--mono);font-size:9px}
.sdot{width:6px;height:6px;border-radius:50%;display:inline-block;margin-right:3px}
.sdot-g{background:#00e596;animation:glow 1.5s infinite}
.sdot-r{background:var(--rd)}
.sdot-a{background:var(--gd)}
.regime-pill{display:inline-flex;align-items:center;gap:5px;font-family:var(--mono);font-size:10px;font-weight:700;padding:3px 9px;border-radius:20px}
.r-trend{background:rgba(0,229,204,.15);color:var(--cy);border:1px solid rgba(0,229,204,.25)}
.r-range{background:rgba(240,180,41,.15);color:var(--gd);border:1px solid rgba(240,180,41,.25)}
.r-vol{background:rgba(255,61,90,.15);color:var(--rd);border:1px solid rgba(255,61,90,.25)}
.tabs-h{display:flex;gap:2px;margin-bottom:16px;background:var(--s3);padding:3px;border-radius:9px}
.tab-h{flex:1;text-align:center;padding:6px;font-family:var(--mono);font-size:9px;letter-spacing:1px;color:var(--tx3);cursor:pointer;border-radius:7px;transition:.15s}
.tab-h.on{background:var(--s2);color:var(--cy);border:1px solid var(--bd)}
.stage-bar{display:flex;gap:3px;margin-top:8px}
.stage{flex:1;height:6px;border-radius:3px;transition:all .3s}
</style>
</head>
<body>
<div id="root"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script>
const {useState,useEffect,useRef}=React;
const R=React.createElement;
const r=(a,b)=>Math.random()*(b-a)+a;
const ri=(a,b)=>Math.floor(r(a,b+1));
const pick=a=>a[ri(0,a.length-1)];
const PAIRS=["EUR/USD","GBP/USD","USD/JPY","AUD/USD","XAU/USD"];
const SESSIONS=["London","New York","Tokyo","Sydney"];
const REGIMES=["trending","ranging","volatile"];

function genRegimes(){
  const m={};
  PAIRS.forEach(p=>{m[p]={regime:pick(REGIMES),adx:ri(14,48),atr_ratio:parseFloat(r(0.6,2.2).toFixed(2))};});
  m["USD/JPY"].regime="ranging";m["USD/JPY"].adx=16;
  m["EUR/USD"].regime="trending";m["EUR/USD"].adx=34;
  PAIRS.forEach(p=>{m[p].blocked=m[p].regime==="ranging"&&m[p].adx<20;});
  return m;
}
function genSignals(reg){
  return Array.from({length:6},(_,i)=>{
    const pair=pick(PAIRS);const blocked=reg[pair]?.blocked;
    return{id:1000+i,pair,dir:pick(["BUY","SELL"]),entry:parseFloat(r(1.05,1.15).toFixed(5)),sl:parseFloat(r(1.03,1.07).toFixed(5)),tp:parseFloat(r(1.10,1.18).toFixed(5)),conf:ri(blocked?30:58,blocked?55:92),bias:pick(["BULLISH","BEARISH"]),rr:parseFloat(r(1.2,2.6).toFixed(1)),news:pick(["CLEAR","CLEAR","CAUTION"]),spread:parseFloat(r(0.8,2.1).toFixed(1)),status:blocked?"blocked":pick(["pending","pending","approved","executed"]),session:pick(SESSIONS),regime:reg[pair]?.regime||"trending",regime_blocked:blocked,shap:[pick(["In demand zone","Bullish BOS","Strong H4 structure","Weekly confluence"]),pick(["Zone tested 2x","HTF alignment","Low spread"])],shapNeg:[pick(["Elevated ATR","News risk","Ranging regime"])],time:`${ri(0,23).toString().padStart(2,"0")}:${ri(0,59).toString().padStart(2,"0")}`};
  });
}
const equityCurve=Array.from({length:55},(_,i)=>{let e=1000+i*9+r(-22,28);return{i,e:Math.max(820,e)};});
const tradesData=Array.from({length:12},(_,i)=>({id:2000+i,pair:pick(PAIRS),dir:pick(["BUY","SELL"]),result:pick(["WIN","WIN","WIN","LOSS","BE"]),r:parseFloat(r(-1,2.8).toFixed(2)),pips:ri(-30,90),dur:`${ri(2,72)}h`,date:`Apr ${ri(1,20)}, 2026`,session:pick(SESSIONS),regime:pick(REGIMES),slippage:parseFloat(r(0.1,1.2).toFixed(1))}));
const PLANS={community:{name:"Community",price:0,color:"var(--tx2)"},starter:{name:"Starter",price:29,color:"var(--bl)"},trader:{name:"Trader",price:79,color:"var(--cy)"},pro:{name:"Pro",price:149,color:"var(--gd)"},elite:{name:"Elite",price:299,color:"var(--vl)"}};

function Badge({children,type="gray"}){
  const c={cy:"b-cy",gd:"b-gd",rd:"b-rd",bl:"b-bl",or:"b-or",gray:"b-gray",gr:"b-gr",vl:"b-vl"};
  return R("span",{className:`badge ${c[type]||"b-gray"}`},children);
}
function Toggle({checked,onChange}){return R("label",{className:"tgl"},R("input",{type:"checkbox",checked,onChange:e=>onChange(e.target.checked)}),R("span",{className:"tsl"}));}
function Prog({val,max,color="var(--cy)"}){return R("div",{className:"prog"},R("div",{className:"prog-f",style:{width:`${Math.min(100,(val/max)*100)}%`,background:color}}));}
function PlanBadge({plan}){const p=PLANS[plan];return R("span",{className:"badge",style:{background:`${p?.color}22`,color:p?.color,border:`1px solid ${p?.color}44`}},plan?.toUpperCase());}
function Notif({msg,type,onDone}){
  useEffect(()=>{const t=setTimeout(onDone,3000);return()=>clearTimeout(t)},[]);
  const c=type==="warn"?"var(--gd)":type==="err"?"var(--rd)":type==="alert"?"var(--or)":"var(--cy)";
  return R("div",{className:"notif",style:{borderColor:c}},R("span",{style:{color:c,marginRight:7}},type==="warn"?"!":type==="err"?"x":type==="alert"?"!!":"ok")," ",msg);
}
function RegimePill({regime}){
  const c={trending:"regime-pill r-trend",ranging:"regime-pill r-range",volatile:"regime-pill r-vol"};
  return R("span",{className:c[regime]||"regime-pill r-range"},regime?.toUpperCase());
}

function App(){
  const [page,setPage]=useState("dashboard");
  const [plan,setPlan]=useState("pro");
  const [regimes,setRegimes]=useState(genRegimes);
  const [signals,setSignals]=useState(()=>genSignals(genRegimes()));
  const [prices,setPrices]=useState({"EUR/USD":1.08421,"GBP/USD":1.26843,"USD/JPY":151.234,"AUD/USD":0.64821,"XAU/USD":2341.5});
  const [notif,setNotif]=useState(null);
  const [bridgeStatus,setBridgeStatus]=useState("online");
  const [ddStage,setDdStage]=useState(0);
  const [ddPct,setDdPct]=useState(3.8);
  const [retrainStatus,setRetrainStatus]=useState("idle");
  const [retrainProg,setRetrainProg]=useState(0);
  const [tradingMode,setTradingMode]=useState("signal_approval");
  const [weeklyOn,setWeeklyOn]=useState(true);
  const [asyncShap,setAsyncShap]=useState(true);
  const [paperMode,setPaperMode]=useState(false);
  const [settingsTab,setSettingsTab]=useState("trading");
  const [modelTab,setModelTab]=useState("status");
  const [adminTab,setAdminTab]=useState("users");
  const [communityDrops,setCommunityDrops]=useState(47);
  const canvasRef=useRef(null);
  const showNotif=(msg,type="ok")=>setNotif({msg,type});
  const can=(f)=>{const pm={community:{},starter:{dashboard:1,signals:1},trader:{dashboard:1,signals:1,approve:1,copy:1,mobile:1},pro:{dashboard:1,signals:1,approve:1,copy:1,mobile:1,auto:1,settings_tg:1},elite:{dashboard:1,signals:1,approve:1,copy:1,mobile:1,auto:1,settings_tg:1,api:1}};return !!(pm[plan]||{})[f];};
  const blockedCount=signals.filter(s=>s.regime_blocked).length;
  const wins=tradesData.filter(t=>t.result==="WIN").length;
  const wr=Math.round(wins/tradesData.length*100);
  const totalR=tradesData.reduce((s,t)=>s+t.r,0);
  const riskColor=["var(--cy)","var(--gd)","var(--or)","var(--rd)"][ddStage];
  const riskLabel=["Normal trading","Stage 1 — Risk capped 0.5%","Stage 2 — Risk capped 0.25%","Stage 3 — TRADING PAUSED"][ddStage];

  useEffect(()=>{
    const iv=setInterval(()=>setPrices(p=>({
      "EUR/USD":parseFloat((p["EUR/USD"]+r(-0.0005,0.0005)).toFixed(5)),
      "GBP/USD":parseFloat((p["GBP/USD"]+r(-0.0006,0.0006)).toFixed(5)),
      "USD/JPY":parseFloat((p["USD/JPY"]+r(-0.06,0.06)).toFixed(3)),
      "AUD/USD":parseFloat((p["AUD/USD"]+r(-0.0004,0.0004)).toFixed(5)),
      "XAU/USD":parseFloat((p["XAU/USD"]+r(-0.5,0.5)).toFixed(2)),
    })),1400);
    return()=>clearInterval(iv);
  },[]);

  useEffect(()=>{
    const cv=canvasRef.current;if(!cv)return;
    const ctx=cv.getContext("2d");const W=cv.width,H=cv.height;
    ctx.clearRect(0,0,W,H);
    const vals=equityCurve.map(e=>e.e);
    const mn=Math.min(...vals)-10,mx=Math.max(...vals)+10;
    const tx=i=>(i/(vals.length-1))*(W-40)+20;
    const ty=v=>H-18-((v-mn)/(mx-mn))*(H-32);
    ctx.strokeStyle="rgba(255,255,255,0.04)";ctx.lineWidth=1;
    for(let i=0;i<5;i++){const y=12+i*(H-30)/4;ctx.beginPath();ctx.moveTo(20,y);ctx.lineTo(W-20,y);ctx.stroke();}
    const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,"rgba(0,229,204,0.2)");g.addColorStop(1,"rgba(0,229,204,0)");
    ctx.beginPath();ctx.moveTo(tx(0),ty(vals[0]));vals.forEach((v,i)=>{if(i)ctx.lineTo(tx(i),ty(v));});
    ctx.lineTo(tx(vals.length-1),H-18);ctx.lineTo(tx(0),H-18);ctx.closePath();ctx.fillStyle=g;ctx.fill();
    ctx.beginPath();ctx.strokeStyle="#00e5cc";ctx.lineWidth=2;ctx.lineJoin="round";
    vals.forEach((v,i)=>{i?ctx.lineTo(tx(i),ty(v)):ctx.moveTo(tx(i),ty(v));});ctx.stroke();
  },[page]);

  function simRetrain(){
    if(retrainStatus==="running")return;
    setRetrainStatus("running");setRetrainProg(0);
    let p=0;const iv=setInterval(()=>{p+=ri(3,9);if(p>=100){clearInterval(iv);setRetrainStatus("done");setRetrainProg(100);showNotif("Model v3 trained — OOS Sharpe: 1.61");}else setRetrainProg(p);},180);
  }

  function simBridgeFail(){
    setBridgeStatus("offline");
    showNotif("BRIDGE OFFLINE — trading paused, users alerted","alert");
    setTimeout(()=>{setBridgeStatus("online");showNotif("Bridge reconnected — trading resumed");},4000);
  }

  const NAV=[
    {grp:"Trading",items:[
      {id:"dashboard",ico:"⬛",lbl:"Dashboard"},
      {id:"regime",ico:"◈",lbl:"Regime Detector",badge:blockedCount>0?`${blockedCount} blocked`:null},
      {id:"signals",ico:"◆",lbl:"Signals"},
      {id:"trades",ico:"↯",lbl:"Trades"},
      {id:"analytics",ico:"◬",lbl:"Analytics"},
    ]},
    {grp:"AI Engine",items:[{id:"model",ico:"◉",lbl:"Model & Retrain"}]},
    {grp:"Account",items:[
      {id:"billing",ico:"◎",lbl:"Billing"},
      {id:"referral",ico:"★",lbl:"Referral"},
      {id:"auditlog",ico:"≡",lbl:"Audit Log"},
      {id:"settings",ico:"◇",lbl:"Settings"},
    ]},
    {grp:"Admin",items:[
      {id:"admin",ico:"●",lbl:"Admin Panel"},
      {id:"community",ico:"⬡",lbl:"Community"},
      {id:"bridge",ico:"▲",lbl:"Bridge Monitor"},
    ]},
  ];

  const PageDashboard=()=>R("div",{style:{display:"flex",flexDirection:"column",gap:12}},
    R("div",{className:"g4"},
      ...[
        {t:"Account Equity",v:`$${(1000+totalR*20).toFixed(2)}`,c:"var(--cy)",s:"+8.2% overall"},
        {t:"Net P&L",v:`${totalR>=0?"+":""}${totalR.toFixed(1)}R`,c:totalR>=0?"var(--cy)":"var(--rd)",s:`${tradesData.length} trades`},
        {t:"Win Rate",v:`${wr}%`,c:"var(--tx)",s:`${wins}W / ${tradesData.length-wins}L`},
        {t:"Regime Blocks",v:blockedCount,c:"var(--or)",s:"signals blocked today"},
      ].map(m=>R("div",{key:m.t,className:"card-sm"},R("div",{className:"ct"},m.t),R("div",{className:"metric",style:{color:m.c}},m.v),R("div",{style:{fontSize:11,color:"var(--tx2)",marginTop:3}},m.s)))
    ),
    R("div",{className:"g2"},
      R("div",{className:"card"},R("div",{className:"ct"},"Equity Curve"),R("canvas",{ref:canvasRef,width:440,height:150,style:{width:"100%",height:150}})),
      R("div",{className:"card"},
        R("div",{className:"ct"},"Drawdown — 3-Stage Protocol"),
        R("div",{style:{display:"flex",justifyContent:"space-between",marginBottom:5}},
          R("span",{style:{fontSize:12,color:"var(--tx2)"}},"Current Drawdown"),
          R("span",{className:"mono",style:{fontSize:12,color:riskColor}},`${ddPct.toFixed(1)}%`)
        ),
        R(Prog,{val:ddPct,max:15,color:riskColor}),
        R("div",{className:"stage-bar"},
          [{c:"var(--cy)",f:67},{c:"var(--gd)",f:13},{c:"var(--or)",f:13},{c:"var(--rd)",f:7}].map((s,i)=>R("div",{key:i,className:"stage",style:{flex:s.f,background:ddStage===i?s.c:`${s.c}33`}}))
        ),
        R("div",{style:{fontFamily:"var(--mono)",fontSize:10,color:riskColor,marginTop:8,marginBottom:12}},riskLabel),
        R("div",{style:{display:"flex",gap:6,marginBottom:10}},
          ["Normal","Stage 1","Stage 2","Stage 3"].map((l,s)=>R("button",{key:s,className:"btn btn-ghost btn-sm",style:{flex:1,justifyContent:"center",borderColor:ddStage===s?riskColor:"var(--bd)"},onClick:()=>{setDdStage(s);setDdPct([3.8,10.2,12.8,15.1][s]);if(s>0)showNotif(["","Stage 1: Risk 0.5%","Stage 2: Risk 0.25%","Stage 3: PAUSED"][s],"warn");}},l))
        ),
        R("div",{style:{fontFamily:"var(--mono)",fontSize:9,color:"var(--tx3)"}},"10% = Stage 1 (risk 0.5%)  ·  12% = Stage 2 (0.25%)  ·  15% = Pause")
      )
    ),
    R("div",{className:"g2"},
      R("div",{className:"card"},
        R("div",{className:"ct"},"Live Regime — All Pairs"),
        R("table",{className:"tbl"},
          R("thead",null,R("tr",null,...["Pair","Regime","ADX","ATR Ratio","Gate"].map(h=>R("th",{key:h},h)))),
          R("tbody",null,...PAIRS.map(pair=>{
            const reg=regimes[pair];
            return R("tr",{key:pair},
              R("td",{className:"mono",style:{fontWeight:700,color:"var(--tx)"}},pair),
              R("td",null,R(RegimePill,{regime:reg.regime})),
              R("td",{className:"mono",style:{color:reg.adx>25?"var(--cy)":reg.adx>20?"var(--gd)":"var(--rd)"}},reg.adx),
              R("td",{className:"mono"},reg.atr_ratio.toFixed(2)),
              R("td",null,reg.blocked?R("span",{className:"badge b-rd"},"BLOCKED"):R("span",{className:"badge b-gr"},"OPEN"))
            );
          }))
        )
      ),
      R("div",{className:"card"},
