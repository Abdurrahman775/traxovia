<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Outer glow filter -->
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <!-- Soft glow for ring -->
    <filter id="ring-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <!-- Node glow -->
    <filter id="node-glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <!-- Radial gradient for background -->
    <radialGradient id="bg-grad" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#111827"/>
      <stop offset="100%" stop-color="#070a0f"/>
    </radialGradient>
    <!-- Cyan gradient for chart line -->
    <linearGradient id="chart-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#00e5cc" stop-opacity="0.3"/>
      <stop offset="60%"  stop-color="#00e5cc"/>
      <stop offset="100%" stop-color="#00e5cc"/>
    </linearGradient>
    <!-- Purple gradient for secondary elements -->
    <linearGradient id="purple-grad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <!-- Fill gradient for chart area -->
    <linearGradient id="fill-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#00e5cc" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#00e5cc" stop-opacity="0"/>
    </linearGradient>
    <!-- Hex clip -->
    <clipPath id="hex-clip">
      <polygon points="
        256,52
        432,154
        432,358
        256,460
        80,358
        80,154
      "/>
    </clipPath>
  </defs>

  <!-- ── Background circle ── -->
  <circle cx="256" cy="256" r="248" fill="url(#bg-grad)"/>

  <!-- ── Subtle grid dots ── -->
  <g opacity="0.07" fill="#00e5cc">
    <!-- Grid pattern 8x8 inside circle area -->
    <circle cx="128" cy="128" r="2"/><circle cx="192" cy="128" r="2"/><circle cx="256" cy="128" r="2"/><circle cx="320" cy="128" r="2"/><circle cx="384" cy="128" r="2"/>
    <circle cx="96"  cy="192" r="2"/><circle cx="160" cy="192" r="2"/><circle cx="224" cy="192" r="2"/><circle cx="288" cy="192" r="2"/><circle cx="352" cy="192" r="2"/><circle cx="416" cy="192" r="2"/>
    <circle cx="96"  cy="256" r="2"/><circle cx="160" cy="256" r="2"/><circle cx="224" cy="256" r="2"/><circle cx="288" cy="256" r="2"/><circle cx="352" cy="256" r="2"/><circle cx="416" cy="256" r="2"/>
    <circle cx="96"  cy="320" r="2"/><circle cx="160" cy="320" r="2"/><circle cx="224" cy="320" r="2"/><circle cx="288" cy="320" r="2"/><circle cx="352" cy="320" r="2"/><circle cx="416" cy="320" r="2"/>
    <circle cx="128" cy="384" r="2"/><circle cx="192" cy="384" r="2"/><circle cx="256" cy="384" r="2"/><circle cx="320" cy="384" r="2"/><circle cx="384" cy="384" r="2"/>
  </g>

  <!-- ── Outer ring ── -->
  <circle cx="256" cy="256" r="230" fill="none" stroke="#00e5cc" stroke-width="2" opacity="0.35" filter="url(#ring-glow)"/>
  <circle cx="256" cy="256" r="222" fill="none" stroke="#00e5cc" stroke-width="0.5" opacity="0.15"/>

  <!-- ── Neural network connector lines (behind nodes) ── -->
  <!-- Left cluster to center -->
  <line x1="138" y1="230" x2="256" y2="256" stroke="#8b5cf6" stroke-width="1" opacity="0.4"/>
  <line x1="138" y1="290" x2="256" y2="256" stroke="#8b5cf6" stroke-width="1" opacity="0.4"/>
  <line x1="155" y1="175" x2="256" y2="256" stroke="#8b5cf6" stroke-width="1" opacity="0.25"/>
  <!-- Right cluster to center -->
  <line x1="374" y1="230" x2="256" y2="256" stroke="#00e5cc" stroke-width="1" opacity="0.4"/>
  <line x1="374" y1="290" x2="256" y2="256" stroke="#00e5cc" stroke-width="1" opacity="0.4"/>
  <line x1="357" y1="175" x2="256" y2="256" stroke="#00e5cc" stroke-width="1" opacity="0.25"/>
  <!-- Top/bottom to center -->
  <line x1="256" y1="148" x2="256" y2="256" stroke="#00e5cc" stroke-width="1.5" opacity="0.3"/>
  <line x1="256" y1="364" x2="256" y2="256" stroke="#8b5cf6" stroke-width="1.5" opacity="0.3"/>
  <!-- Cross connections -->
  <line x1="138" y1="230" x2="138" y2="290" stroke="#8b5cf6" stroke-width="0.8" opacity="0.3"/>
  <line x1="374" y1="230" x2="374" y2="290" stroke="#00e5cc" stroke-width="0.8" opacity="0.3"/>
  <line x1="138" y1="230" x2="256" y2="148" stroke="#6366f1" stroke-width="0.8" opacity="0.2"/>
  <line x1="374" y1="230" x2="256" y2="148" stroke="#00e5cc" stroke-width="0.8" opacity="0.2"/>

  <!-- ── Candlestick chart (main focal element) ── -->
  <!-- Chart area fill -->
  <polygon
    points="108,310 152,285 196,300 240,258 284,240 328,220 372,195 372,340 108,340"
    fill="url(#fill-grad)"
    opacity="0.8"
  />
  <!-- Chart trend line -->
  <polyline
    points="108,310 152,285 196,300 240,258 284,240 328,220 372,195"
    fill="none"
    stroke="url(#chart-grad)"
    stroke-width="3.5"
    stroke-linecap="round"
    stroke-linejoin="round"
    filter="url(#glow)"
  />

  <!-- Candlestick bars -->
  <!-- Bar 1 — red (down) -->
  <rect x="134" y="278" width="10" height="22" rx="1.5" fill="#ff3d5a" opacity="0.85"/>
  <line x1="139" y1="272" x2="139" y2="278" stroke="#ff3d5a" stroke-width="1.5" opacity="0.85"/>
  <line x1="139" y1="300" x2="139" y2="306" stroke="#ff3d5a" stroke-width="1.5" opacity="0.85"/>
  <!-- Bar 2 — green (up) -->
  <rect x="178" y="280" width="10" height="26" rx="1.5" fill="#00e5cc" opacity="0.9"/>
  <line x1="183" y1="272" x2="183" y2="280" stroke="#00e5cc" stroke-width="1.5" opacity="0.9"/>
  <line x1="183" y1="306" x2="183" y2="312" stroke="#00e5cc" stroke-width="1.5" opacity="0.9"/>
  <!-- Bar 3 — green (up) -->
  <rect x="222" y="248" width="10" height="28" rx="1.5" fill="#00e5cc" opacity="0.9"/>
  <line x1="227" y1="240" x2="227" y2="248" stroke="#00e5cc" stroke-width="1.5"/>
  <line x1="227" y1="276" x2="227" y2="284" stroke="#00e5cc" stroke-width="1.5"/>
  <!-- Bar 4 — red (down) -->
  <rect x="266" y="234" width="10" height="18" rx="1.5" fill="#ff3d5a" opacity="0.75"/>
  <line x1="271" y1="228" x2="271" y2="234" stroke="#ff3d5a" stroke-width="1.5" opacity="0.75"/>
  <line x1="271" y1="252" x2="271" y2="258" stroke="#ff3d5a" stroke-width="1.5" opacity="0.75"/>
  <!-- Bar 5 — green (up, big) -->
  <rect x="310" y="212" width="11" height="32" rx="1.5" fill="#00e5cc"/>
  <line x1="315.5" y1="204" x2="315.5" y2="212" stroke="#00e5cc" stroke-width="1.5"/>
  <line x1="315.5" y1="244" x2="315.5" y2="252" stroke="#00e5cc" stroke-width="1.5"/>
  <!-- Bar 6 — green (up, tallest) -->
  <rect x="354" y="188" width="11" height="30" rx="1.5" fill="#00e5cc" filter="url(#glow)"/>
  <line x1="359.5" y1="178" x2="359.5" y2="188" stroke="#00e5cc" stroke-width="1.5"/>
  <line x1="359.5" y1="218" x2="359.5" y2="226" stroke="#00e5cc" stroke-width="1.5"/>

  <!-- ── Neural network nodes ── -->
  <!-- Left column -->
  <circle cx="138" cy="230" r="7" fill="#111827" stroke="#8b5cf6" stroke-width="2" filter="url(#node-glow)"/>
  <circle cx="138" cy="230" r="3" fill="#8b5cf6"/>
  <circle cx="138" cy="290" r="7" fill="#111827" stroke="#8b5cf6" stroke-width="2" filter="url(#node-glow)"/>
  <circle cx="138" cy="290" r="3" fill="#8b5cf6"/>
  <circle cx="155" cy="175" r="5.5" fill="#111827" stroke="#6366f1" stroke-width="1.5" opacity="0.7"/>
  <circle cx="155" cy="175" r="2.5" fill="#6366f1" opacity="0.7"/>
  <!-- Right column -->
  <circle cx="374" cy="230" r="7" fill="#111827" stroke="#00e5cc" stroke-width="2" filter="url(#node-glow)"/>
  <circle cx="374" cy="230" r="3" fill="#00e5cc"/>
  <circle cx="374" cy="290" r="7" fill="#111827" stroke="#00e5cc" stroke-width="2" filter="url(#node-glow)"/>
  <circle cx="374" cy="290" r="3" fill="#00e5cc"/>
  <circle cx="357" cy="175" r="5.5" fill="#111827" stroke="#00e5cc" stroke-width="1.5" opacity="0.7"/>
  <circle cx="357" cy="175" r="2.5" fill="#00e5cc" opacity="0.7"/>
  <!-- Top node -->
  <circle cx="256" cy="148" r="9" fill="#111827" stroke="#00e5cc" stroke-width="2.5" filter="url(#node-glow)"/>
  <circle cx="256" cy="148" r="4" fill="#00e5cc"/>
  <!-- Bottom node -->
  <circle cx="256" cy="364" r="7" fill="#111827" stroke="#8b5cf6" stroke-width="2" filter="url(#node-glow)"/>
  <circle cx="256" cy="364" r="3" fill="#8b5cf6"/>
  <!-- Center node (main) -->
  <circle cx="256" cy="256" r="14" fill="#111827" stroke="#00e5cc" stroke-width="2.5" filter="url(#node-glow)"/>
  <circle cx="256" cy="256" r="7"  fill="#00e5cc" opacity="0.95"/>
  <circle cx="256" cy="256" r="3"  fill="#ffffff" opacity="0.9"/>

  <!-- ── Upward arrow (signal / execution) ── -->
  <polyline points="390,320 390,270 420,270" fill="none" stroke="#00e5cc" stroke-width="2" opacity="0.5" stroke-linecap="round"/>
  <polygon  points="420,260 432,270 420,280" fill="#00e5cc" opacity="0.5"/>

  <!-- ── Horizontal base line (chart floor) ── -->
  <line x1="108" y1="340" x2="404" y2="340" stroke="#00e5cc" stroke-width="1" opacity="0.2"/>

  <!-- ── Text: "TRAXOVIA" ── -->
  <text
    x="256" y="416"
    font-family="'Courier New', Courier, monospace"
    font-size="26"
    font-weight="700"
    letter-spacing="8"
    text-anchor="middle"
    fill="#ffffff"
    opacity="0.92"
  >TRAXOVIA</text>

  <!-- ── Text: "AI" (cyan accent) ── -->
  <text
    x="256" y="450"
    font-family="'Courier New', Courier, monospace"
    font-size="16"
    font-weight="400"
    letter-spacing="16"
    text-anchor="middle"
    fill="#00e5cc"
    opacity="0.8"
  >A I</text>

  <!-- ── Thin accent lines under text ── -->
  <line x1="156" y1="460" x2="356" y2="460" stroke="#00e5cc" stroke-width="0.75" opacity="0.25"/>

  <!-- ── Corner tick marks (subtle, military HUD vibe) ── -->
  <path d="M60,80 L60,56 L84,56"   fill="none" stroke="#00e5cc" stroke-width="1.5" opacity="0.3" stroke-linecap="round"/>
  <path d="M452,80 L452,56 L428,56" fill="none" stroke="#00e5cc" stroke-width="1.5" opacity="0.3" stroke-linecap="round"/>
  <path d="M60,432 L60,456 L84,456"  fill="none" stroke="#00e5cc" stroke-width="1.5" opacity="0.3" stroke-linecap="round"/>
  <path d="M452,432 L452,456 L428,456" fill="none" stroke="#00e5cc" stroke-width="1.5" opacity="0.3" stroke-linecap="round"/>
</svg>